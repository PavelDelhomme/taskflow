# Hubera Tasks = Taskflow réel (plus la landing).
# Le conteneur historique `taskflow` (NPM) reste : on y charge ce nginx en proxy.
# Ne jamais down -v.

server {
    listen 80;
    listen [::]:80;
    listen 3003;
    listen [::]:3003;
    server_name _;
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;

    location = / {
        default_type text/html;
        root /usr/share/nginx/html;
        try_files /hubera-landing.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /app {
        return 302 /app/;
    }
    location /app/ {
        proxy_pass http://hubera-taskflow-web:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/(health|docs|redoc|openapi\.json|auth|tasks|workflows|reports|templates|subtasks|tags|notes|stats|energy|breaks|reminders|attention|ai) {
        proxy_pass http://hubera-taskflow-api:8000;
    }

    location / {
        proxy_pass http://hubera-taskflow-web:3000;
    }
}
