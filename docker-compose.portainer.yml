# Hubera Portainer Git — unitaire.
# Stack: hubera-taskflow
# Compose: docker-compose.portainer.yml
# Réseau: ${NPM_NETWORK:-shared-network-copy}
# Ne jamais: docker compose down -v · Remove volumes · rename stacks users.

services:
  web:
    build: .
    image: taskflow:local
    container_name: taskflow
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - hubera.slug=taskflow
      - hubera.update_channel=taskflow
    volumes:
      - hubera-taskflow-html:/var/cache/nginx
    networks:
      - proxy

volumes:
  hubera-taskflow-html:
    name: hubera-taskflow-html

networks:
  proxy:
    external: true
    name: ${NPM_NETWORK:-shared-network-copy}
